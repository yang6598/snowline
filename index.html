<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>雪线 · Snowline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1b1b2f; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  canvas#c { display: block; }

  #hud {
    position: fixed; top: 26px; left: 32px; right: 32px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
    opacity: 0; transition: opacity 1.4s ease;
    font-variant-numeric: tabular-nums;
  }
  #hud.show { opacity: 1; }
  #hud .dist {
    font-size: 22px; font-weight: 300; letter-spacing: 3px;
    color: rgba(255,255,255,0.92);
  }
  #hud .dist small { font-size: 12px; letter-spacing: 2px; opacity: 0.55; margin-left: 6px; }
  #hud .flowers {
    display: flex; align-items: center; gap: 9px;
    font-size: 17px; font-weight: 300; letter-spacing: 2px;
    color: rgba(255,240,210,0.95);
  }
  #hud .flowers i {
    display: block; width: 9px; height: 9px; border-radius: 50%;
    background: #ffe9a8; box-shadow: 0 0 9px 3px rgba(255,216,130,0.8);
  }

  #intro {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#20203a, #3a2c46 55%, #6b4a52);
    transition: opacity 1.8s ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 {
    font-size: 44px; font-weight: 200; letter-spacing: 20px; text-indent: 20px;
    color: #fdf6ee; text-shadow: 0 0 34px rgba(255,220,180,0.45);
    opacity: 0; animation: rise 2.2s 0.3s ease forwards;
  }
  #intro h2 {
    margin-top: 14px; font-size: 11px; font-weight: 300;
    letter-spacing: 8px; text-indent: 8px; color: #b9aec6;
    opacity: 0; animation: rise 2.2s 1s ease forwards;
  }
  #intro .start {
    margin-top: 68px; font-size: 13px; letter-spacing: 6px; text-indent: 6px;
    color: #e6d8c8; cursor: pointer;
    opacity: 0; animation: pulse 3s 2.2s ease-in-out infinite;
  }
  @keyframes rise { from { opacity:0; transform: translateY(14px);} to {opacity:1; transform:none;} }
  @keyframes pulse { 0%,100%{opacity:.25;} 50%{opacity:.95;} }

  #hint {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 3px; color: rgba(250,244,238,0.6);
    text-align: center; line-height: 2.1;
    opacity: 0; transition: opacity 1.2s ease; pointer-events: none; z-index: 10;
  }
  #hint.show { opacity: 1; }
  #hint b { font-weight: 500; color: rgba(255,238,210,0.92); }

  #boot {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: #191a2b; color: #9a9ab5; font-size: 13px; letter-spacing: 2px;
    transition: opacity 1s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .err {
    color: #ffa891; max-width: 76%; line-height: 1.9; font-size: 12px;
    white-space: pre-wrap; font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="dist"><span id="dist">0</span><small>M</small></div>
  <div class="flowers"><i></i><span id="score">0</span></div>
</div>

<div id="hint">
  <b>按住</b> 加速 &nbsp;·&nbsp; <b>松开 / 空格</b> 起跳 &nbsp;·&nbsp; 滑过的地方会开出发光的花
</div>

<div id="intro">
  <h1>雪线</h1>
  <h2>SNOWLINE</h2>
  <div class="start" id="startBtn">点 击 开 始 下 滑</div>
</div>

<div id="boot"><div id="bootMsg">正在载入雪原…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="./main.js"></script>
<script>
  // 把任何运行期错误直接显示出来，避免只看到"载入中"
  window.addEventListener('error', function (e) {
    var m = document.getElementById('bootMsg');
    var b = document.getElementById('boot');
    if (!m) return;
    b.classList.remove('gone');
    m.className = 'err';
    m.textContent = '出错了：\n' + (e.message || e.error || '未知错误') + '\n' + (e.filename || '');
  });
</script>
</body>
</html>
