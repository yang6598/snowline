<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>雪线 · Snowline</title>
<style>
  :root{
    --ink: rgba(255,255,255,0.95);
    --dim: rgba(255,255,255,0.40);
    --line: rgba(255,255,255,0.14);
    --gold: #ffd8a0;
    --mint: #8ee6d4;
    --glass: rgba(18,18,32,0.45);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; }
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    background:#15162a; color:var(--ink);
    user-select:none; -webkit-user-select:none; touch-action:none;
    -webkit-font-smoothing:antialiased;
  }
  canvas#c{ display:block; position:fixed; inset:0; }

  #ui{
    position:fixed; inset:0; z-index:10; pointer-events:none;
    opacity:0; transition:opacity 1.6s ease;
    font-variant-numeric:tabular-nums;
  }
  #ui.show{ opacity:1; }

  /* ---------- 顶部 ---------- */
  .hud-top{
    position:absolute; top:26px; left:34px; right:34px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:24px;
  }
  .stat{ display:flex; flex-direction:column; gap:5px; }
  .stat .v{
    font-size:30px; font-weight:300; letter-spacing:2px; line-height:1;
    display:flex; align-items:baseline; gap:5px;
    text-shadow:0 1px 3px rgba(30,24,50,0.88), 0 2px 18px rgba(30,24,50,0.5);
  }
  .stat .v em{ font-size:10px; font-style:normal; letter-spacing:2px; opacity:.55; }
  .stat .k, .k{
    font-size:9px; letter-spacing:3.2px; color:rgba(255,255,255,0.80); font-weight:500;
    text-shadow:0 1px 3px rgba(30,24,50,0.85), 0 0 12px rgba(30,24,50,0.5);
  }
  .stat.orbs{ align-items:flex-end; }
  .stat.orbs .v{ color:#fff3d6; }

  .phase{ flex:1; max-width:340px; margin-top:4px; }
  .phase-track{
    position:relative; height:2px; border-radius:2px;
    background:rgba(30,25,55,0.35); overflow:visible;
  }
  .phase-fill{
    position:absolute; left:0; top:0; height:2px; width:0%;
    background:linear-gradient(90deg,#ffb27a,#a68cff,#56e0c8);
    border-radius:2px; box-shadow:0 0 12px rgba(255,190,140,0.5);
    transition:width .3s linear;
  }
  .phase-track i{
    position:absolute; top:-2px; width:1px; height:6px;
    background:rgba(255,255,255,0.30);
  }
  .phase-names{
    display:flex; justify-content:space-between; margin-top:9px;
    font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.60);
    text-shadow:0 1px 3px rgba(35,28,58,0.55);
  }

  /* ---------- 速度 ---------- */
  .speed{
    position:absolute; left:34px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:8px;
  }
  .speed-num{ font-size:15px; font-weight:400; letter-spacing:1px; text-shadow:0 1px 3px rgba(30,24,50,0.85), 0 0 14px rgba(30,24,50,0.45); }
  .speed-num em{ font-size:8px; font-style:normal; letter-spacing:2px; opacity:.55; margin-left:4px; }
  .speed-bar{
    width:3px; height:118px; border-radius:3px;
    background:rgba(30,25,55,0.32); position:relative; overflow:hidden;
  }
  .speed-bar div{
    position:absolute; left:0; bottom:0; width:100%; height:0%;
    background:linear-gradient(0deg,#7ad7ff,#ffd8a0 70%,#ff9a6a);
    border-radius:3px; transition:height .14s linear;
  }

  /* ---------- 能量 ---------- */
  .boost{
    position:absolute; left:34px; bottom:34px;
    display:flex; flex-direction:column; gap:7px; width:132px;
  }
  .boost-bar{
    height:2px; border-radius:2px; background:rgba(30,25,55,0.32); overflow:hidden;
  }
  .boost-bar div{
    height:100%; width:100%;
    background:linear-gradient(90deg,#6fe3c0,#9ad8ff);
    box-shadow:0 0 10px rgba(120,225,200,0.7);
    transition:width .1s linear;
  }
  .boost.low .boost-bar div{ background:linear-gradient(90deg,#ff8f6b,#ffb27a); }

  /* ---------- 小伙伴 ---------- */
  .friends{
    position:absolute; right:34px; bottom:34px; text-align:right;
    display:flex; flex-direction:column; align-items:flex-end; gap:5px;
  }
  .friends .dot{
    width:7px; height:7px; border-radius:50%; background:var(--mint);
    box-shadow:0 0 10px 2px rgba(120,225,200,0.7); margin-bottom:2px;
  }
  .friends .v{ font-size:22px; font-weight:200; letter-spacing:1px; color:#e6fff8; }

  /* ---------- 分数 ---------- */
  .score{
    position:absolute; left:34px; top:112px;
    display:flex; flex-direction:column; gap:4px;
  }
  .score .v{
    font-size:24px; font-weight:200; letter-spacing:1.5px; line-height:1;
    color:#ffe6c0;
    text-shadow:0 1px 4px rgba(35,28,58,0.62), 0 2px 20px rgba(255,190,120,0.35);
    transition:transform .12s ease-out;
  }
  .score .v.bump{ transform:scale(1.14); }

  /* ---------- 连击 ---------- */
  .combo{
    position:absolute; right:34px; top:110px; text-align:right;
    display:flex; flex-direction:column; align-items:flex-end; gap:3px;
    opacity:0; transform:translateY(-4px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .combo.on{ opacity:1; transform:none; }
  .combo .x{
    font-size:26px; font-weight:300; letter-spacing:1px; line-height:1;
    color:#fff0c8;
    text-shadow:0 0 18px rgba(255,190,110,0.85), 0 1px 4px rgba(35,28,58,0.6);
  }
  .combo .x em{ font-size:13px; font-style:normal; opacity:.85; }
  .combo .k{ color:rgba(255,225,180,0.75); }
  .combo .bar{
    width:78px; height:2px; border-radius:2px; margin-top:3px;
    background:rgba(255,220,170,0.20); overflow:hidden;
  }
  .combo .bar i{
    display:block; height:100%; width:100%;
    background:linear-gradient(90deg,#ffd8a0,#ff9a6a);
    box-shadow:0 0 8px rgba(255,190,120,0.8);
  }
  .combo.hot .x{ color:#fff; text-shadow:0 0 24px rgba(255,150,90,1); }

  /* ---------- 效果提示 ---------- */
  .chip{
    position:absolute; left:50%; bottom:92px; transform:translateX(-50%) translateY(10px);
    padding:8px 18px; border-radius:22px; white-space:nowrap;
    font-size:11px; letter-spacing:3px; color:#fff;
    background:rgba(18,18,32,0.55); border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    opacity:0; transition:opacity .35s ease, transform .35s ease;
    box-shadow:0 6px 30px rgba(0,0,0,0.2);
  }
  .chip.on{ opacity:1; transform:translateX(-50%) translateY(0); }

  .pop{
    position:absolute; left:50%; top:36%; transform:translate(-50%,0);
    font-size:15px; letter-spacing:5px; color:#fff; opacity:0; text-align:center;
    text-shadow:0 2px 24px rgba(30,20,50,0.6);
  }
  .pop.go{ animation:popUp 1.3s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes popUp{
    0%{ opacity:0; transform:translate(-50%,14px) scale(.92); }
    18%{ opacity:1; transform:translate(-50%,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-38px) scale(1); }
  }

  /* ---------- 键位 ---------- */
  .keys{
    position:absolute; left:50%; bottom:30px; transform:translateX(-50%);
    display:flex; gap:22px; align-items:center;
    padding:9px 18px; border-radius:30px;
    background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    transition:opacity .8s ease;
  }
  .keys.fade{ opacity:0; }
  .keys .row{ display:flex; align-items:center; gap:5px; }
  .keys .row span{ font-size:9.5px; letter-spacing:2px; color:var(--dim); margin-left:4px; }
  kbd{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; padding:0 6px;
    font-family:inherit; font-size:9.5px; letter-spacing:1px;
    color:rgba(255,255,255,0.82);
    border:1px solid rgba(255,255,255,0.22); border-radius:5px;
    background:rgba(255,255,255,0.06);
  }

  /* ---------- 开场 ---------- */
  #intro{
    position:fixed; inset:0; z-index:20; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#1a1c33 0%,#33284a 48%,#7a5050 78%,#c98a6a 100%);
    transition:opacity 1.9s ease;
  }
  #intro.gone{ opacity:0; pointer-events:none; }
  #intro h1{
    font-size:46px; font-weight:200; letter-spacing:22px; text-indent:22px;
    text-shadow:0 0 40px rgba(255,215,170,0.5);
    opacity:0; animation:rise 2.4s .3s ease forwards;
  }
  #intro h2{
    margin-top:16px; font-size:10px; font-weight:300;
    letter-spacing:9px; text-indent:9px; color:#c3b4c8;
    opacity:0; animation:rise 2.4s 1s ease forwards;
  }
  #intro .rule{
    width:0; height:1px; margin-top:34px;
    background:linear-gradient(90deg,transparent,rgba(255,225,190,0.55),transparent);
    animation:grow 2.6s 1.6s ease forwards;
  }
  #intro .keys2{
    margin-top:28px; display:flex; gap:26px;
    opacity:0; animation:rise 2.2s 2.1s ease forwards;
  }
  #intro .keys2 .row{ display:flex; align-items:center; gap:6px; }
  #intro .keys2 .row span{ font-size:9.5px; letter-spacing:2px; color:rgba(240,225,220,0.5); }
  #intro .start{
    margin-top:52px; font-size:12px; letter-spacing:7px; text-indent:7px;
    color:#f0e2d2; opacity:0; animation:pulse 3.2s 2.6s ease-in-out infinite;
  }
  @keyframes rise{ from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:none;} }
  @keyframes grow{ from{width:0;} to{width:210px;} }
  @keyframes pulse{ 0%,100%{opacity:.22;} 50%{opacity:.95;} }

  #boot{
    position:fixed; inset:0; z-index:30;
    display:flex; align-items:center; justify-content:center;
    background:#15162a; color:#8d8da8; font-size:12px; letter-spacing:3px;
    transition:opacity 1s ease;
  }
  #boot.gone{ opacity:0; pointer-events:none; }
  #boot .err{
    color:#ffa891; max-width:76%; line-height:1.9; font-size:12px;
    white-space:pre-wrap; font-family:ui-monospace,monospace;
  }

  /* ---------- 摔倒 ---------- */
  #flash{
    position:fixed; inset:0; z-index:24; pointer-events:none;
    background:#fff; opacity:0; transition:opacity .22s ease;
  }
  #flash.on{ opacity:.62; }

  #dead{
    position:fixed; inset:0; z-index:25;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 44%,rgba(24,18,40,0.40) 0%,rgba(9,8,18,0.88) 78%);
    opacity:0; pointer-events:none;
    transition:opacity .8s ease;
  }
  #dead.on{ opacity:1; pointer-events:auto; }
  #dead .card{
    text-align:center; transform:translateY(14px) scale(.98);
    transition:transform .9s cubic-bezier(.2,.85,.3,1);
  }
  #dead.on .card{ transform:none; }
  #dead .em{ font-size:30px; opacity:.9; margin-bottom:14px; }
  #dead h2{
    font-size:34px; font-weight:200; letter-spacing:16px; text-indent:16px;
    text-shadow:0 0 44px rgba(255,205,170,0.35);
  }
  #dead .sub{
    margin-top:14px; font-size:10px; letter-spacing:5px; text-indent:5px;
    color:rgba(255,255,255,0.44);
  }
  #dead .rows{ display:flex; gap:34px; justify-content:center; margin-top:42px; flex-wrap:wrap; }
  #dead .rows .r{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  #dead .rows .n{ font-size:23px; font-weight:200; letter-spacing:1px; }
  #dead .rows .k{ font-size:9px; letter-spacing:3px; color:rgba(255,255,255,0.42); }
  #dead .rows .r.best .n{ color:#ffd8a0; }
  #dead button{
    margin-top:50px; padding:13px 36px; border-radius:30px; cursor:pointer;
    font-family:inherit; font-size:11px; letter-spacing:6px; text-indent:6px;
    color:#fff; background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.22);
    transition:background .35s ease, border-color .35s ease, transform .35s ease;
  }
  #dead button:hover{
    background:rgba(255,255,255,0.15);
    border-color:rgba(255,255,255,0.44);
    transform:translateY(-1px);
  }

  @media (max-width:720px){
    .hud-top{ top:18px; left:18px; right:18px; gap:12px; }
    .stat .v{ font-size:22px; }
    .speed{ left:18px; }
    .speed-bar{ height:80px; }
    .boost{ left:18px; bottom:22px; width:100px; }
    .friends{ right:18px; bottom:22px; }
    .chip{ bottom:76px; font-size:10px; letter-spacing:2px; }
    #dead h2{ font-size:26px; letter-spacing:10px; text-indent:10px; }
    #dead .rows{ gap:20px; margin-top:26px; }
    .score{ left:18px; top:86px; }
    .score .v{ font-size:19px; }
    .combo{ right:18px; top:84px; }
    .combo .x{ font-size:20px; }
    #dead .rows .n{ font-size:19px; }
    .keys{ gap:12px; padding:7px 12px; }
    .keys .row span{ display:none; }
    .phase{ max-width:150px; }
    #intro h1{ font-size:32px; letter-spacing:14px; text-indent:14px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="hud-top">
    <div class="stat">
      <div class="v"><span id="dist">0</span><em>M</em></div>
      <div class="k">DISTANCE</div>
    </div>

    <div class="phase">
      <div class="phase-track">
        <div class="phase-fill" id="phaseFill"></div>
        <i style="left:0%"></i><i style="left:42%"></i><i style="left:72%"></i><i style="left:100%"></i>
      </div>
      <div class="phase-names"><span>黄昏</span><span>暮色</span><span>夜幕</span><span>极光</span></div>
    </div>

    <div class="stat orbs">
      <div class="v"><span id="orbs">0</span><em>/ 180</em></div>
      <div class="k">LIGHT</div>
    </div>
  </div>

  <div class="score">
    <div class="v" id="pts">0</div>
    <div class="k">SCORE</div>
  </div>

  <div class="combo" id="comboWrap">
    <div class="x"><em>×</em><span id="comboN">1.0</span></div>
    <div class="k">COMBO</div>
    <div class="bar"><i id="comboFill"></i></div>
  </div>

  <div class="speed">
    <div class="speed-num"><span id="speedVal">0</span><em>KM/H</em></div>
    <div class="speed-bar"><div id="speedFill"></div></div>
    <div class="k">SPEED</div>
  </div>

  <div class="boost" id="boostWrap">
    <div class="k">BOOST</div>
    <div class="boost-bar"><div id="boostFill"></div></div>
  </div>

  <div class="friends">
    <div class="dot"></div>
    <div class="v"><span id="score">0</span></div>
    <div class="k">FRIENDS</div>
  </div>

  <div class="chip" id="chip"></div>
  <div class="pop" id="pop"></div>

  <div class="keys" id="keysHint">
    <div class="row"><kbd>A</kbd><kbd>D</kbd><span>转向</span></div>
    <div class="row"><kbd>SPACE</kbd><span>起跳</span></div>
    <div class="row"><kbd>W</kbd><span>空中翻转</span></div>
    <div class="row"><kbd>SHIFT</kbd><span>冲刺</span></div>
  </div>
</div>

<div id="flash"></div>

<div id="dead">
  <div class="card">
    <div class="em">❄</div>
    <h2>摔 倒 了</h2>
    <div class="sub" id="dSub">头 先 着 地 · 没 能 站 稳</div>
    <div class="rows">
      <div class="r"><div class="n" id="dPts">0</div><div class="k">SCORE</div></div>
      <div class="r"><div class="n" id="dDist">0</div><div class="k">DISTANCE / M</div></div>
      <div class="r"><div class="n" id="dOrbs">0</div><div class="k">LIGHT</div></div>
      <div class="r"><div class="n" id="dBuddies">0</div><div class="k">FRIENDS</div></div>
      <div class="r best"><div class="n" id="dBest">0</div><div class="k">BEST / M</div></div>
    </div>
    <button id="againBtn">再 滑 一 次</button>
  </div>
</div>

<div id="intro">
  <h1>雪线</h1>
  <h2>SNOWLINE</h2>
  <div class="rule"></div>
  <div class="keys2">
    <div class="row"><kbd>A</kbd><kbd>D</kbd><span>左右转向</span></div>
    <div class="row"><kbd>SPACE</kbd><span>起跳</span></div>
    <div class="row"><kbd>W</kbd><span>空中翻转</span></div>
    <div class="row"><kbd>SHIFT</kbd><span>冲刺</span></div>
  </div>
  <div class="start" id="startBtn">点 击 开 始 下 滑</div>
</div>

<div id="boot"><div id="bootMsg">正在载入雪原…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "./three.module.js"
  }
}
</script>
<script type="module" src="./main.js"></script>
<script>
  window.addEventListener('error', function (e) {
    var m = document.getElementById('bootMsg');
    var b = document.getElementById('boot');
    if (!m) return;
    b.classList.remove('gone');
    m.className = 'err';
    m.textContent = '出错了：\n' + (e.message || e.error || '未知错误') + '\n' + (e.filename || '');
  });
</script>
</body>
</html>
